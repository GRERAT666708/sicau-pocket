# 80 → 443 跳转（独立文件，排在 sites-enabled 最前面，确保赢得 server_name 匹配）
# 由 pull-and-deploy.sh 在检测到证书后自动安装；不含 ssl_certificate，不受覆盖保护影响。
server {
    listen 80;
    listen [::]:80;
    server_name sicau-pocket.com www.sicau-pocket.com;

    # 证书里没有 www 的话，把这行改成 return 301 https://sicau-pocket.com$request_uri;
    return 301 https://$host$request_uri;
}
