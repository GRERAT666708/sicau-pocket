# 川农口袋官网 —— Nginx 站点配置
#
# 用法：
#   sudo cp site/deploy/nginx-sicau-pocket.conf /etc/nginx/sites-available/sicau-pocket
#   sudo ln -sf /etc/nginx/sites-available/sicau-pocket /etc/nginx/sites-enabled/sicau-pocket
#   sudo rm -f /etc/nginx/sites-enabled/default     # 可选：去掉默认站点
#   sudo nginx -t && sudo systemctl reload nginx
#
# 之后跑一次 `sudo certbot --nginx -d sicau-pocket.com -d www.sicau-pocket.com`，
# certbot 会自动往下面这个 server 块里插入 443 与证书配置（选 Redirect 即可）。

server {
    listen 80;
    listen [::]:80;
    server_name sicau-pocket.com www.sicau-pocket.com;

    root /var/www/sicau-pocket;
    index index.html;

    charset utf-8;
    server_tokens off;

    # 上传 APK / 以后放新包时用
    client_max_body_size 100m;

    # ★ 关键：APK 必须声明 MIME，否则安卓浏览器会把安装包当文本/乱码打开
    types {
        application/vnd.android.package-archive apk;
    }
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/javascript application/json
               application/xml image/svg+xml application/manifest+json;

    # 安全与隐私：不做统计、不引三方，顺手把常见的头补齐
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # 静态资源长缓存（带指纹或很少变的图片/样式）
    location ^~ /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
        try_files $uri =404;
    }

    # APK 一天缓存，方便发新版本
    location ^~ /apk/ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        add_header Content-Disposition "inline" always;
        try_files $uri =404;
    }

    # 页面：不缓存，改完立刻生效
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # 自定义 404
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # 无 www → www（可选；也可以反过来）
    # if ($host = sicau-pocket.com) {
    #     return 301 https://www.sicau-pocket.com$request_uri;
    # }

    access_log /var/log/nginx/sicau-pocket.access.log;
    error_log  /var/log/nginx/sicau-pocket.error.log warn;

    # certbot 申请的证书会放在这里；证书就绪后 certbot 会自动加上 listen 443 ssl 等
    # ssl_certificate     /etc/letsencrypt/live/sicau-pocket.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/sicau-pocket.com/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
